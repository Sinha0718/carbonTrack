# Zero-setup demo profile: embedded H2 database (PostgreSQL mode), no Docker or PostgreSQL needed.
# Data is kept in backend/data/ between restarts; delete that folder to start fresh.
spring:
  datasource:
    url: jdbc:h2:file:./data/carbontrack-demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

carbontrack:
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@carbontrack.local}
    password: ${ADMIN_PASSWORD:Admin123!}
