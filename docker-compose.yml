services:
  postgres:
    image: postgres:16-alpine
    container_name: carbontrack-postgres
    environment:
      POSTGRES_DB: carbontrack
      POSTGRES_USER: carbontrack
      POSTGRES_PASSWORD: carbontrack
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbontrack -d carbontrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
